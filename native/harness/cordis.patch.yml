- id: entry-customization
  disabled: true
- id: ui-brand-official
  disabled: true
- id: agent-preset-registry
  config:
    default: workbench
- id: connection
  config:
    trustedHosts:
      - !!js process.env.WORKBENCH_PUBLIC_HOST || 'localhost'
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
- id: preset-ptc
  disabled: true
- insert:
    - id: preset-workbench
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: workbench
        name: 工作台专家
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是个人工作台的执行助理。使用专家 Skill 判断，使用标准工具读取资料和执行工作；只根据真实结果汇报。
              complete: false
          - name: '@deepseek-ai/dsh-time-context'
          - name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              agentsHome: !!js process.env.DSH_HOME + '/agents'
          - name: '@deepseek-ai/dsh-tool-skill'
          - name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - name: '@deepseek-ai/dsh-compaction-basic'
              - name: '@deepseek-ai/dsh-command-compact'
    - id: personal-workbench
      name: '@local/personal-workbench'
      config:
        workerUrl: !!js process.env.WORKBENCH_WORKER_URL || 'http://127.0.0.1:7381'
        bridgePort: !!js Number(process.env.WORKBENCH_BRIDGE_PORT || 7382)
        personalWorkspace: !!js process.env.WORKBENCH_PERSONAL_WORKSPACE
        provider: !!js process.env.WORKBENCH_MODEL_PROVIDER || 'deepseek-official'
        model: !!js process.env.WORKBENCH_MODEL || 'deepseek-flash'
        reasoningEffort: !!js process.env.WORKBENCH_REASONING_EFFORT || 'off'
        reasoningEffortByProject: !!js JSON.parse(process.env.WORKBENCH_PROJECT_REASONING || '{}')
        toolServers: !!js JSON.parse(process.env.WORKBENCH_TOOL_SERVERS || '[]')
